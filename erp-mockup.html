<!DOCTYPE html>
<html lang="ro" data-theme="light" data-density="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Damina ERP — machetă de interfață</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   DAMINA ERP · machetă de interfață pentru birou
   Fișier unic, fără nicio legătură cu aplicația.
   ═══════════════════════════════════════════════════════════ */

:root{
  --bg:#F7F5F1; --surf:#FFFFFF; --surf-2:#FBFAF7; --sunk:#F0EDE7; --sunk-2:#E9E5DD;
  --line:#E5E0D7; --line-2:#D2CBBE;
  --tx:#1A1917; --tx-2:#605B53; --tx-3:#918B81;
  --acc:#1F5B8F; --acc-2:#17456D; --acc-soft:#E7F0F8; --acc-line:#B7D0E7; --acc-tx:#17456D;
  --ok:#2A7A5F; --ok-soft:#E1F0EA; --ok-line:#B6DBCA;
  --warn:#95700F; --warn-soft:#F7EFD9; --warn-line:#E4CF9C;
  --bad:#A03F27; --bad-soft:#F9E7E0; --bad-line:#EBC0AF;
  --rail:#14171C; --rail-2:#1C2027; --rail-3:#262C35; --rail-tx:#C9CDD3; --rail-tx-2:#79808A;
  --sh-1:0 1px 2px rgba(20,18,15,.05);
  --sh-2:0 6px 20px -8px rgba(20,18,15,.20), 0 1px 3px rgba(20,18,15,.06);
  --sh-3:0 28px 64px -20px rgba(20,18,15,.36), 0 4px 12px rgba(20,18,15,.10);
  --r:10px; --r-2:7px; --r-3:5px;
  --fs:"Archivo",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --fn:"Archivo Narrow","Archivo",ui-sans-serif,system-ui,sans-serif;
  --row-y:9px; --tbl-fs:13px;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#101215; --surf:#181B20; --surf-2:#1D2126; --sunk:#212530; --sunk-2:#272C36;
  --line:#292E36; --line-2:#3A4049;
  --tx:#E8E5E0; --tx-2:#A39D94; --tx-3:#7B756C;
  --acc:#5A9BD6; --acc-2:#7FB4E4; --acc-soft:#14283A; --acc-line:#27455F; --acc-tx:#8CBCE6;
  --ok:#54A98A; --ok-soft:#122B22; --ok-line:#254A3B;
  --warn:#C9A44A; --warn-soft:#2C2412; --warn-line:#4C3F1D;
  --bad:#D07257; --bad-soft:#301B14; --bad-line:#553025;
  --rail:#0C0E11; --rail-2:#14171C; --rail-3:#1E232A; --rail-tx:#BFC4CB; --rail-tx-2:#6E757E;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 6px 20px -8px rgba(0,0,0,.6), 0 1px 3px rgba(0,0,0,.4);
  --sh-3:0 28px 64px -20px rgba(0,0,0,.7), 0 4px 12px rgba(0,0,0,.4);
  color-scheme:dark;
}
[data-density="compact"]{--row-y:5px;--tbl-fs:12.5px}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--fs);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;color:inherit}
a{color:inherit;text-decoration:none}
table{border-collapse:collapse;width:100%}
svg{display:block}
.num,.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
::selection{background:var(--acc-soft);color:var(--acc-tx)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--tx-3);background-clip:content-box;border:3px solid transparent}
::-webkit-scrollbar-track{background:transparent}

/* ───────── schelet ───────── */
.app{display:flex;height:100dvh;overflow:hidden}

/* ───────── rail ───────── */
.rail{width:244px;flex:0 0 244px;background:var(--rail);color:var(--rail-tx);display:flex;flex-direction:column;
  transition:flex-basis .2s cubic-bezier(.4,0,.2,1),width .2s cubic-bezier(.4,0,.2,1)}
.app.mini .rail{width:64px;flex-basis:64px}
.app.mini .r-tx,.app.mini .r-grp,.app.mini .r-badge,.app.mini .u-meta,.app.mini .r-kbd,.app.mini .brand-tx{display:none}
.app.mini .r-item{justify-content:center;padding-inline:0;margin-inline:8px}
.app.mini .r-search{justify-content:center}
.brand{display:flex;align-items:center;gap:11px;padding:15px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
.brand-mk{width:34px;height:34px;flex:0 0 34px;border-radius:9px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(145deg,#3E7FB8,#1B4570);font-family:var(--fn);font-weight:700;font-size:16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.brand-tx b{display:block;font-family:var(--fn);font-size:15.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:#fff;line-height:1.15}
.brand-tx span{display:block;font-size:10.5px;color:var(--rail-tx-2);letter-spacing:.05em;margin-top:1px}
.r-search{display:flex;align-items:center;gap:9px;margin:11px 10px 6px;height:34px;padding:0 10px;width:calc(100% - 20px);
  border-radius:var(--r-2);background:rgba(255,255,255,.055);color:var(--rail-tx-2);font-size:13px;
  border:1px solid rgba(255,255,255,.05);transition:background .14s,color .14s}
.r-search:hover{background:rgba(255,255,255,.1);color:var(--rail-tx)}
.r-kbd{margin-left:auto;font-size:10px;border:1px solid rgba(255,255,255,.14);border-radius:4px;padding:1px 5px}
.r-scroll{flex:1;overflow-y:auto;padding:6px 0 12px;scrollbar-width:thin}
.r-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);background-clip:content-box}
.r-grp{font-family:var(--fn);font-size:10px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;
  color:var(--rail-tx-2);padding:13px 18px 6px}
.r-item{display:flex;align-items:center;gap:11px;margin:1px 8px;padding:7px 10px;border-radius:var(--r-2);
  font-size:13px;color:var(--rail-tx);position:relative;transition:background .13s,color .13s}
.r-item:hover{background:rgba(255,255,255,.06);color:#fff}
.r-item.on{background:rgba(255,255,255,.1);color:#fff;font-weight:500}
.r-item.on::before{content:"";position:absolute;left:-8px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:#5A9BD6}
.r-item svg{flex:0 0 17px;opacity:.75}
.r-item.on svg{opacity:1;color:#8FBEE8}
.r-tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-badge{margin-left:auto;font-size:10px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  display:grid;place-items:center;background:rgba(255,255,255,.11);color:#fff}
.r-badge.hot{background:#A64832}
.r-foot{border-top:1px solid rgba(255,255,255,.06);padding:9px}
.u-btn{display:flex;align-items:center;gap:10px;width:100%;padding:7px;border-radius:var(--r-2);text-align:left}
.u-btn:hover{background:rgba(255,255,255,.07)}
.ava{width:30px;height:30px;flex:0 0 30px;border-radius:50%;display:grid;place-items:center;font-size:12px;
  font-weight:600;background:linear-gradient(145deg,#3C4855,#2A323C);color:#DDE3EA}
.u-meta b{display:block;font-size:12.5px;font-weight:500;color:#fff}
.u-meta span{display:block;font-size:10.5px;color:var(--rail-tx-2)}

/* ───────── topbar ───────── */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:10px;padding:0 16px 0 10px;
  background:var(--surf);border-bottom:1px solid var(--line);position:relative;z-index:30}
.ico{width:34px;height:34px;border-radius:var(--r-2);display:grid;place-items:center;color:var(--tx-2);position:relative;
  transition:background .13s,color .13s}
.ico:hover{background:var(--sunk);color:var(--tx)}
.crumbs{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--tx-3);min-width:0;white-space:nowrap}
.crumbs b{color:var(--tx);font-weight:500}
.top-search{margin:0 auto;display:flex;align-items:center;gap:9px;height:36px;width:min(430px,38vw);padding:0 12px;
  border:1px solid var(--line);border-radius:var(--r-2);background:var(--surf-2);color:var(--tx-3);font-size:13px;
  transition:border-color .13s,background .13s}
.top-search:hover{border-color:var(--line-2);background:var(--surf)}
.top-r{display:flex;align-items:center;gap:5px}
.per{display:flex;align-items:center;gap:8px;height:34px;padding:0 11px;border:1px solid var(--line);
  border-radius:var(--r-2);font-size:13px;color:var(--tx-2);background:var(--surf-2)}
.per:hover{border-color:var(--line-2);color:var(--tx)}
.per b{color:var(--tx);font-weight:500}
.bdot{position:absolute;top:5px;right:5px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);
  color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;line-height:1;border:2px solid var(--surf)}
.role{display:flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:999px;background:var(--acc-soft);
  color:var(--acc-tx);font-size:12.5px;font-weight:500;border:1px solid var(--acc-line)}

.canvas{flex:1;overflow-y:auto;scroll-behavior:smooth}
.page{max-width:1560px;margin:0 auto;padding:22px 26px 80px}

/* ───────── titluri ───────── */
.eyebrow{font-family:var(--fn);font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--tx-3)}
h1.t{font-family:var(--fn);font-size:26px;font-weight:600;letter-spacing:-.015em;line-height:1.15}
.phead{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;padding-bottom:15px;border-bottom:1px solid var(--line);margin-bottom:20px}
.phead .meta{font-size:13px;color:var(--tx-2);margin-top:6px}
.phead .acts{margin-left:auto;display:flex;align-items:center;gap:8px}
.srule{display:flex;align-items:center;gap:13px;margin:26px 0 12px}
.srule h2{font-family:var(--fn);font-size:14px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.srule .ln{flex:1;height:1px;background:var(--line)}
.srule .rt{font-size:12px;color:var(--tx-2);white-space:nowrap}

/* ───────── butoane ───────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--r-2);
  font-size:13px;font-weight:500;white-space:nowrap;border:1px solid transparent;
  transition:background .13s,border-color .13s,box-shadow .13s,transform .08s}
.btn:active{transform:translateY(.5px)}
.btn.p{background:var(--acc);color:#fff;box-shadow:var(--sh-1)}
.btn.p:hover{background:var(--acc-2)}
.btn.d{background:var(--surf);border-color:var(--line-2);color:var(--tx)}
.btn.d:hover{background:var(--sunk);border-color:var(--tx-3)}
.btn.q{color:var(--tx-2)}
.btn.q:hover{background:var(--sunk);color:var(--tx)}
.btn.x{background:var(--bad);color:#fff}
.btn.s{height:29px;padding:0 10px;font-size:12px;gap:5px;border-radius:var(--r-3)}
.split{display:inline-flex}
.split .p{border-radius:var(--r-2) 0 0 var(--r-2)}
.split .car{background:var(--acc);color:#fff;width:30px;height:36px;border-radius:0 var(--r-2) var(--r-2) 0;
  display:grid;place-items:center;border-left:1px solid rgba(255,255,255,.2)}
.split .car:hover{background:var(--acc-2)}

/* ───────── suprafețe ───────── */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1)}
.cp{padding:16px 18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.auto{grid-template-columns:repeat(auto-fit,minmax(400px,1fr))}
.two{display:grid;grid-template-columns:1fr 316px;gap:20px;align-items:start}

/* ───────── KPI ───────── */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 12px;
  box-shadow:var(--sh-1);transition:border-color .14s,box-shadow .14s,transform .14s}
.kpi:hover{border-color:var(--line-2);box-shadow:var(--sh-2);transform:translateY(-1px)}
.kpi .kl{font-size:11.5px;color:var(--tx-2);display:flex;align-items:center;gap:6px}
.kpi .kval{font-family:var(--fn);font-size:27px;font-weight:600;letter-spacing:-.02em;line-height:1.25;font-variant-numeric:tabular-nums}
.kpi .kval small{font-size:13px;font-weight:500;color:var(--tx-3);margin-left:3px}
.kpi .kf{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px}
.dlt{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.dlt.u{color:var(--ok)} .dlt.d{color:var(--bad)} .dlt.f{color:var(--tx-3)}
.dlt em{font-style:normal;font-weight:400;color:var(--tx-3)}

/* ───────── badge ───────── */
.badge{display:inline-flex;align-items:center;gap:5px;padding:2.5px 8px;border-radius:999px;font-size:11px;font-weight:500;
  line-height:1.45;border:1px solid transparent;white-space:nowrap}
.badge .dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex:0 0 5px}
.badge.n{background:var(--sunk);color:var(--tx-2);border-color:var(--line)}
.badge.a{background:var(--acc-soft);color:var(--acc-tx);border-color:var(--acc-line)}
.badge.o{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.badge.w{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.badge.b{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}

/* ───────── gauge ───────── */
.gg{display:grid;gap:5px;padding:11px 0}
.gg+.gg{border-top:1px solid var(--line)}
.gt{display:flex;align-items:baseline;gap:9px;font-size:13px}
.gt b{font-weight:500}
.gt .pc{margin-left:auto;font-family:var(--fn);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.gtr{height:8px;border-radius:5px;background:var(--sunk-2);overflow:hidden;position:relative}
.gtr i{display:block;height:100%;border-radius:5px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.gmk{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--tx);opacity:.4;border-radius:2px}
.gc{font-size:11px;color:var(--tx-3);font-variant-numeric:tabular-nums;display:flex;gap:11px;flex-wrap:wrap}
.mbar{height:6px;width:52px;border-radius:4px;background:var(--sunk-2);display:inline-block;vertical-align:middle;overflow:hidden}
.mbar i{display:block;height:100%;border-radius:4px}

/* ───────── bara de unelte ───────── */
.tbar{position:sticky;top:0;z-index:18;background:var(--bg);padding:4px 0 11px;margin-bottom:2px}
.segs{display:inline-flex;gap:2px;padding:3px;background:var(--sunk);border-radius:var(--r-2);margin-bottom:11px}
.seg{padding:6px 12px;border-radius:var(--r-3);font-size:12.5px;color:var(--tx-2);transition:background .13s,color .13s}
.seg:hover{color:var(--tx)}
.seg.on{background:var(--surf);color:var(--tx);font-weight:500;box-shadow:var(--sh-1)}
.seg .c{margin-left:6px;font-size:11px;color:var(--tx-3);font-variant-numeric:tabular-nums}
.flt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.srch{display:flex;align-items:center;gap:8px;height:34px;padding:0 11px;background:var(--surf);border:1px solid var(--line-2);
  border-radius:var(--r-2);min-width:250px;color:var(--tx-3)}
.srch:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.srch input{border:0;outline:0;background:none;font-size:13px;width:100%}
.srch input::placeholder{color:var(--tx-3)}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line-2);
  background:var(--surf);font-size:12px;color:var(--tx-2);transition:all .13s}
.chip:hover{border-color:var(--tx-3);color:var(--tx)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tr8{margin-left:auto;display:flex;align-items:center;gap:6px}
.cnt{font-size:11.5px;color:var(--tx-3);font-variant-numeric:tabular-nums}

/* ───────── tabel ───────── */
.twrap{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh-1)}
.tscroll{overflow-x:auto}
.tbl{font-size:var(--tbl-fs)}
.tbl thead th{font-family:var(--fn);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--tx-3);text-align:left;padding:10px 13px;background:var(--surf-2);border-bottom:1px solid var(--line-2);
  position:sticky;top:0;z-index:2;white-space:nowrap}
.tbl th.n,.tbl td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tbody tr{border-bottom:1px solid var(--line);transition:background .1s}
.tbl tbody tr:last-child{border-bottom:0}
.tbl tbody tr.cl:hover{background:var(--surf-2);cursor:pointer}
.tbl tbody tr.sel{background:var(--acc-soft)}
.tbl td{padding:var(--row-y) 13px;vertical-align:middle}
.tbl .code{font-family:var(--fn);font-weight:600;letter-spacing:.01em;white-space:nowrap}
.tbl .mu{color:var(--tx-3)}
.tbl .sub{font-size:11.5px;color:var(--tx-3);margin-top:2px}
.tbl tfoot td{padding:11px 13px;border-top:2px solid var(--line-2);background:var(--surf-2);font-weight:600;
  font-variant-numeric:tabular-nums}
.grp td{background:var(--sunk);font-family:var(--fn);font-size:10.5px;font-weight:600;letter-spacing:.11em;
  text-transform:uppercase;color:var(--tx-2);padding:7px 13px}
.racts{display:flex;gap:2px;justify-content:flex-end;opacity:0;transition:opacity .1s}
tr:hover .racts,tr:focus-within .racts{opacity:1}
.cbx{width:15px;height:15px;border:1.5px solid var(--line-2);border-radius:4px;display:inline-grid;place-items:center;
  background:var(--surf);vertical-align:-2px;color:transparent}
.cbx.on{background:var(--acc);border-color:var(--acc);color:#fff}
.mini{font-size:11.5px;color:var(--tx-3)}

/* ───────── bara de selecție ───────── */
.bulk{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(14px);z-index:55;display:flex;align-items:center;
  gap:12px;padding:10px 12px 10px 16px;background:var(--tx);color:var(--bg);border-radius:12px;box-shadow:var(--sh-3);
  opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;font-size:13px}
.bulk.on{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.bulk .bb{height:29px;padding:0 11px;border-radius:6px;background:rgba(255,255,255,.13);font-size:12.5px;font-weight:500}
.bulk .bb:hover{background:rgba(255,255,255,.22)}

/* ───────── stări / note ───────── */
.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:28px;background:var(--surf-2)}
.empty h4{font-family:var(--fn);font-size:15.5px;font-weight:600;margin-bottom:6px}
.empty p{font-size:12.5px;color:var(--tx-2);max-width:52ch;margin-bottom:13px}
.note{display:flex;gap:11px;padding:12px 15px;border-radius:var(--r-2);font-size:12.5px;line-height:1.55;border:1px solid}
.note svg{flex:0 0 16px;margin-top:1px}
.note.a{background:var(--acc-soft);color:var(--acc-tx);border-color:var(--acc-line)}
.note.w{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.note.b{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}
.note.o{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}

/* ───────── detaliu ───────── */
.dhead{position:sticky;top:0;z-index:19;background:var(--bg);padding:16px 0 13px;border-bottom:1px solid var(--line)}
.dtop{display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.dtitle{font-family:var(--fn);font-size:22px;font-weight:600;letter-spacing:-.012em}
.dacts{margin-left:auto;display:flex;gap:8px;align-items:center}
.pipe{display:flex;align-items:center;margin-top:13px;flex-wrap:wrap}
.stp{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 11px;font-size:12px;color:var(--tx-3);
  background:var(--surf-2);border:1px solid var(--line);margin-right:-1px}
.stp:first-child{border-radius:var(--r-2) 0 0 var(--r-2)}
.stp:last-child{border-radius:0 var(--r-2) var(--r-2) 0;margin-right:0}
.stp .nm{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;
  background:var(--sunk-2);color:var(--tx-3)}
.stp.dn{color:var(--ok);background:var(--ok-soft);border-color:var(--ok-line)}
.stp.dn .nm{background:var(--ok);color:#fff}
.stp.nw{color:var(--acc-tx);background:var(--acc-soft);border-color:var(--acc-line);font-weight:600;z-index:1}
.stp.nw .nm{background:var(--acc);color:#fff}
.tabs{display:flex;gap:3px;margin-top:14px;margin-bottom:-13px}
.tab{padding:9px 13px;font-size:13px;color:var(--tx-2);border-bottom:2px solid transparent;border-radius:var(--r-3) var(--r-3) 0 0}
.tab:hover{color:var(--tx);background:var(--surf-2)}
.tab.on{color:var(--tx);font-weight:500;border-bottom-color:var(--acc)}
.tab .c{color:var(--tx-3);font-size:11.5px;margin-left:5px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 14px;font-size:13px}
.kv dt{color:var(--tx-2);font-size:12px}
.kv dd{font-variant-numeric:tabular-nums}
.trail{position:relative;padding-left:20px}
.trail::before{content:"";position:absolute;left:5px;top:7px;bottom:7px;width:1px;background:var(--line)}
.ti{position:relative;padding-bottom:15px}
.ti:last-child{padding-bottom:0}
.ti::before{content:"";position:absolute;left:-18px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--surf);
  border:2px solid var(--line-2)}
.ti.dn::before{background:var(--ok);border-color:var(--ok)}
.ti.nw::before{background:var(--acc);border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.ti b{font-size:12.5px;font-weight:500;display:block}
.ti span{font-size:11.5px;color:var(--tx-3)}

/* ───────── overlay-uri ───────── */
.scrim{position:fixed;inset:0;background:rgba(18,16,14,.42);backdrop-filter:blur(2px);opacity:0;pointer-events:none;
  transition:opacity .18s;z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.drw{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:94vw;background:var(--surf);border-left:1px solid var(--line);
  box-shadow:var(--sh-3);transform:translateX(103%);transition:transform .24s cubic-bezier(.32,.72,0,1);z-index:70;
  display:flex;flex-direction:column}
.drw.on{transform:none}
.dh{display:flex;align-items:flex-start;gap:12px;padding:17px 19px;border-bottom:1px solid var(--line)}
.db{flex:1;overflow-y:auto;padding:17px 19px}
.df{display:flex;align-items:center;gap:8px;padding:13px 19px;border-top:1px solid var(--line);background:var(--surf-2)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.985);width:660px;max-width:94vw;max-height:88vh;
  background:var(--surf);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh-3);z-index:80;opacity:0;
  pointer-events:none;transition:opacity .16s,transform .16s;display:flex;flex-direction:column}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.mh{display:flex;align-items:center;gap:11px;padding:16px 19px;border-bottom:1px solid var(--line)}
.mh h3{font-family:var(--fn);font-size:17px;font-weight:600}
.mb{padding:19px;overflow-y:auto}
.mf{display:flex;align-items:center;gap:8px;padding:14px 19px;border-top:1px solid var(--line);background:var(--surf-2);
  border-radius:0 0 13px 13px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.fl{display:block}
.fl>span{display:block;font-family:var(--fn);font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;
  color:var(--tx-3);margin-bottom:6px}
.req{color:var(--bad)}
.ctl{height:38px;width:100%;padding:0 11px;border:1px solid var(--line-2);border-radius:var(--r-2);background:var(--surf);
  font-size:13.5px;outline:0;transition:border-color .13s,box-shadow .13s}
.ctl:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.hint{font-size:11.5px;color:var(--tx-3);margin-top:6px}
.full{grid-column:1/-1}

.pal{position:fixed;left:50%;top:12vh;transform:translateX(-50%) translateY(-8px);width:640px;max-width:94vw;background:var(--surf);
  border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh-3);z-index:90;opacity:0;pointer-events:none;
  transition:opacity .14s,transform .14s;overflow:hidden}
.pal.on{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.pi{display:flex;align-items:center;gap:11px;padding:15px 17px;border-bottom:1px solid var(--line);color:var(--tx-3)}
.pi input{border:0;outline:0;background:none;font-size:16px;width:100%}
.pl{max-height:46vh;overflow-y:auto;padding:7px}
.ps{font-family:var(--fn);font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--tx-3);padding:9px 11px 5px}
.pit{display:flex;align-items:center;gap:12px;padding:9px 11px;border-radius:var(--r-2);font-size:13.5px;width:100%;text-align:left}
.pit:hover,.pit.cur{background:var(--acc-soft);color:var(--acc-tx)}
.pit svg{color:var(--tx-3)}
.pit:hover svg,.pit.cur svg{color:var(--acc)}
.pit .w{margin-left:auto;font-size:11px;color:var(--tx-3)}
.pf{display:flex;gap:17px;padding:9px 15px;border-top:1px solid var(--line);background:var(--surf-2);font-size:11px;color:var(--tx-3)}
kbd{font-family:var(--fs);font-size:10px;border:1px solid var(--line-2);border-radius:4px;padding:1px 5px;background:var(--surf)}

.pop{position:absolute;top:50px;right:16px;width:390px;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh-2);z-index:75;opacity:0;pointer-events:none;transform:translateY(-6px);
  transition:opacity .14s,transform .14s;overflow:hidden}
.pop.on{opacity:1;pointer-events:auto;transform:none}
.ph{display:flex;align-items:center;justify-content:space-between;padding:11px 15px;border-bottom:1px solid var(--line);background:var(--surf-2)}
.pr{display:flex;gap:11px;padding:12px 15px;border-bottom:1px solid var(--line)}
.pr:last-child{border-bottom:0}
.pr:hover{background:var(--surf-2)}
.pd{width:7px;height:7px;border-radius:50%;margin-top:5px;flex:0 0 7px}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);z-index:95;display:flex;align-items:center;
  gap:12px;padding:12px 16px;background:var(--tx);color:var(--bg);border-radius:11px;box-shadow:var(--sh-3);font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;max-width:min(560px,92vw)}
.toast.on{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.toast .ok{color:#6FD3AE;flex:0 0 18px}
.toast button{color:#8FC0EC;font-weight:500;font-size:12.5px;margin-left:2px;white-space:nowrap}

/* ───────── diagrame ───────── */
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px}
.bcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bcol .stack{width:100%;max-width:54px;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:2px}
.bcol .bseg{border-radius:3px;transition:height .5s cubic-bezier(.4,0,.2,1)}
.bcol .bl{font-size:11px;color:var(--tx-3)}
.mtx{display:grid;gap:3px;font-size:12px}
.mtx .mrow{display:grid;grid-template-columns:170px repeat(6,1fr);gap:3px;align-items:center}
.mcell{height:34px;border-radius:var(--r-3);display:grid;place-items:center;font-size:11.5px;border:1px solid var(--line);
  background:var(--surf);font-variant-numeric:tabular-nums}
.mcell.cl{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok);font-weight:600}
.mcell.op{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.mcell.fu{background:var(--sunk);color:var(--tx-3)}
.mcell:hover{border-color:var(--acc);cursor:pointer}
.gantt{display:grid;gap:4px}
.grow{display:grid;grid-template-columns:180px 1fr;gap:12px;align-items:center;font-size:12.5px}
.gbar{position:relative;height:26px;background:var(--sunk);border-radius:var(--r-3);overflow:hidden}
.gseg{position:absolute;top:3px;bottom:3px;border-radius:4px;display:flex;align-items:center;padding:0 8px;font-size:11px;
  color:#fff;white-space:nowrap;overflow:hidden}
.gscale{display:grid;grid-template-columns:180px 1fr;gap:12px;font-size:10.5px;color:var(--tx-3);margin-bottom:2px}
.gticks{display:flex;justify-content:space-between}

.split-v{display:grid;grid-template-columns:400px 1fr;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  background:var(--surf);box-shadow:var(--sh-1);min-height:560px}
.sv-l{border-right:1px solid var(--line);overflow-y:auto;max-height:660px}
.sv-i{padding:13px 15px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
.sv-i:hover{background:var(--surf-2)}
.sv-i.on{background:var(--acc-soft);box-shadow:inset 3px 0 0 var(--acc)}
.sv-r{padding:19px 21px;overflow-y:auto;max-height:660px}

.foot-note{max-width:1560px;margin:0 auto;padding:0 26px 46px}
@media (max-width:1200px){.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.split-v{grid-template-columns:1fr}
  .top-search{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="rail">
    <div class="brand">
      <div class="brand-mk">D</div>
      <div class="brand-tx"><b>Damina</b><span>Damina Construct SRL</span></div>
    </div>
    <button class="r-search" onclick="palOpen()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      <span class="r-tx">Caută sau execută</span><span class="r-kbd">⌘K</span>
    </button>
    <div class="r-scroll" id="railNav"></div>
    <div class="r-foot">
      <button class="u-btn" onclick="toast('Meniu de cont: profil · perspectivă · setări firmă · ieșire')">
        <span class="ava">MI</span>
        <span class="u-meta"><b>Mihai Ionescu</b><span>Administrator</span></span>
      </button>
    </div>
  </nav>

  <div class="main">
    <header class="top">
      <button class="ico" onclick="document.getElementById('app').classList.toggle('mini')" aria-label="Restrânge">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9.5 4v16"/></svg>
      </button>
      <nav class="crumbs" id="crumbs"></nav>
      <button class="top-search" onclick="palOpen()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        <span>Caută contract, lucrare, document…</span>
        <span style="margin-left:auto;display:flex;gap:3px"><kbd>⌘</kbd><kbd>K</kbd></span>
      </button>
      <div class="top-r">
        <button class="per" onclick="toast('Perioada activă schimbă toate cifrele din ecran, nu doar filtrul listei.')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
          <b>august 2026</b>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <button class="ico" onclick="toggleDensity()" id="densBtn" aria-label="Densitate" title="Densitatea tabelelor">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <button class="ico" onclick="toggleTheme()" id="themeBtn" aria-label="Temă"></button>
        <button class="ico" id="bell" onclick="popToggle(event)" aria-label="Semnale">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="bdot">4</span>
        </button>
        <span class="role">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="2.6"/></svg>
          Administrator
        </span>
      </div>
      <div class="pop" id="pop"></div>
    </header>
    <div class="canvas" id="canvas"></div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drw" id="drw"></aside>
<div class="modal" id="modal"></div>
<div class="pal" id="pal">
  <div class="pi">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
    <input id="palIn" placeholder="Mergi la ecran, caută un document sau execută o acțiune…" oninput="palFilter(this.value)">
    <kbd>Esc</kbd>
  </div>
  <div class="pl" id="palList"></div>
  <div class="pf"><span><kbd>↑</kbd><kbd>↓</kbd> navighează</span><span><kbd>↵</kbd> deschide</span><span><kbd>⌘</kbd><kbd>K</kbd> oricând</span></div>
</div>
<div class="bulk" id="bulk"></div>
<div class="toast" id="toast">
  <svg class="ok" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="m5 13 4 4L19 7"/></svg>
  <span id="toastMsg"></span><button id="toastAct" onclick="toastHide()">Închide</button>
</div>
<script>
/* ════════ iconuri (un singur set, desenat inline) ════════ */
const I={
 panou:'<path d="M3 13h7V3H3zM14 21h7V11h-7zM14 7h7V3h-7zM3 21h7v-4H3z"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/>',
 contract:'<path d="M14 3v5h5M15 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M9 13h6M9 17h4"/>',
 pin:'<path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/>',
 chat:'<path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/>',
 list:'<path d="M4 6h16M4 12h10M4 18h7"/>',
 tool:'<path d="M14.5 5.5 18 9l-8.5 8.5H6v-3.5z"/><path d="M4 21h16"/>',
 coin:'<path d="M12 2v20"/><path d="M17 6.5c0-1.9-2.2-3-5-3s-5 1.1-5 3 2.2 2.8 5 3.2 5 1.3 5 3.3-2.2 3.2-5 3.2-5-1.3-5-3.2"/>',
 swap:'<path d="M17 3l4 4-4 4"/><path d="M21 7H8a4 4 0 0 0-4 4"/><path d="M7 21l-4-4 4-4"/><path d="M3 17h13a4 4 0 0 0 4-4"/>',
 lock:'<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M8 3v4M16 3v4M3 11h18"/><path d="m9 16 2 2 4-4"/>',
 doc:'<rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 7h8M8 11h8M8 15h5"/>',
 box:'<path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/>',
 check:'<path d="M14 3v5h5M15 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="m9 15 2 2 4-4"/>',
 shield:'<path d="M12 3 4 6.5v5c0 4.6 3.4 8.4 8 9.5 4.6-1.1 8-4.9 8-9.5v-5z"/>',
 stock:'<path d="M3 8h18v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M2 4h20v4H2zM10 12h4"/>',
 cart:'<circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.7 12.4a1.5 1.5 0 0 0 1.5 1.1h8.4a1.5 1.5 0 0 0 1.5-1.2L21 7H6"/>',
 nir:'<path d="m3 9 9-5 9 5v9l-9 5-9-5z"/><path d="m8.5 12 2.5 2.5 4.5-4.5"/>',
 truckB:'<circle cx="7" cy="18" r="2.5"/><circle cx="17" cy="18" r="2.5"/><path d="M4 18H3v-5l3-5h5v10M12 13h9v5h-1.5"/>',
 wrench:'<path d="M14.7 6.3a4 4 0 0 0 5.3 5.3l-7.4 7.4a2.4 2.4 0 1 1-3.4-3.4z"/><path d="M4 4l5 5"/>',
 truck:'<path d="M2 7h11v10H2zM13 10h4l4 4v3h-8z"/><circle cx="6.5" cy="18.5" r="1.6"/><circle cx="17.5" cy="18.5" r="1.6"/>',
 bag:'<path d="M12 3a5 5 0 0 1 5 5v3h1a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2h1V8a5 5 0 0 1 5-5"/>',
 file:'<path d="M4 4a2 2 0 0 1 2-2h7l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M13 2v5h5"/>',
 chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 bill:'<path d="M5 3h14v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
 book:'<path d="M4 5h16M4 12h16M4 19h16"/><circle cx="8" cy="5" r="1.6"/><circle cx="14" cy="12" r="1.6"/><circle cx="10" cy="19" r="1.6"/>',
 plug:'<path d="M9 3v4M15 3v4M9 17v4M15 17v4M3 9h4M3 15h4M17 9h4M17 15h4"/><rect x="7" y="7" width="10" height="10" rx="2.5"/>',
 eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="2.6"/>',
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 16v-4m0-4h.01"/>',
 warn:'<path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 x:'<path d="M18 6 6 18M6 6l12 12"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8"/>'
};
const ic=(n,s)=>'<svg width="'+(s||16)+'" height="'+(s||16)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+(I[n]||I.doc)+'</svg>';

/* ════════ helperi de conținut ════════ */
const bd=(t,x,d)=>`<span class="badge ${t}">${d?'<i class="dot"></i>':''}${x}</span>`;
const bar=(p,t)=>`<span class="mbar"><i style="width:${Math.max(2,Math.min(p,100))}%;background:var(--${t})"></i></span>`;
const spark=(pts,c)=>`<svg width="76" height="24" viewBox="0 0 76 24"><polyline points="${pts}" fill="none" stroke="var(--${c})" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function gauge(o){
  const t=o.tone||'ok';
  return `<div class="gg"><div class="gt"><b>${o.label}</b>${o.tag||''}<span class="pc" style="color:var(--${t})">${o.pct}%</span></div>
  <div class="gtr"><i style="width:${Math.min(o.pct,100)}%;background:var(--${t})"></i>${o.mark?`<span class="gmk" style="left:${o.mark}%"></span>`:''}</div>
  <div class="gc">${(o.cap||[]).map(x=>`<span>${x}</span>`).join('')}</div></div>`;
}
function kpi(o){
  return `<div class="kpi"><div class="kl">${o.label}</div>
  <div class="kval"${o.tone?` style="color:var(--${o.tone})"`:''}>${o.value}${o.unit?`<small>${o.unit}</small>`:''}</div>
  <div class="kf"><span class="dlt ${o.dir||'f'}">${o.delta||''}${o.sub?` <em>${o.sub}</em>`:''}</span>${o.spark?spark(o.spark,o.sparkC||'ok'):''}</div></div>`;
}
function tbl(cols,rows,foot,opt){
  opt=opt||{};
  const th=cols.map(c=>`<th${c.n?' class="n"':''}${c.w?` style="width:${c.w}"`:''}>${c.h||''}</th>`).join('');
  const body=rows.map(r=>{
    if(r[0]==='#G') return `<tr class="grp"><td colspan="${cols.length}">${r[1]}</td></tr>`;
    const click=opt.noclick?'':` class="cl" onclick="${opt.onclick||'drawer()'}"`;
    return `<tr${click}>${r.map((c,j)=>`<td${cols[j]&&cols[j].n?' class="n"':''}>${c==null?'<span class="mu">—</span>':c}</td>`).join('')}</tr>`;
  }).join('');
  let tf='';
  if(foot){
    tf='<tfoot><tr>'+foot.map((c,j)=>{
      if(c&&c.span!==undefined) return `<td colspan="${c.span}"${c.n?' class="n"':''}>${c.v}</td>`;
      return `<td${cols[j]&&cols[j].n?' class="n"':''}>${c==null?'':c}</td>`;
    }).join('')+'</tr></tfoot>';
  }
  return `<div class="twrap"><div class="tscroll"><table class="tbl"><thead><tr>${th}</tr></thead><tbody>${body}</tbody>${tf}</table></div></div>`;
}

function palOpen(){popClose();document.getElementById('pal').classList.add('on');scrim.classList.add('on');
  const i=document.getElementById('palIn');i.value='';palFilter('');setTimeout(()=>i.focus(),40);}
function palFilter(q){
  const s=q.trim().toLowerCase();
  const hits=PAL.filter(p=>!s||p.l.toLowerCase().includes(s)||p.w.toLowerCase().includes(s)).slice(0,15);
  const L=document.getElementById('palList');
  if(!hits.length){L.innerHTML=`<div class="ps">Niciun rezultat pentru „${q}”</div>`;return;}
  let h='',sec='';
  hits.forEach((p,i)=>{if(p.s!==sec){sec=p.s;h+=`<div class="ps">${sec}</div>`;}
    h+=`<button class="pit${i===0?' cur':''}" data-i="${PAL.indexOf(p)}">${ic(p.i,16)}<span>${p.l}</span>${p.w?`<span class="w">${p.w}</span>`:''}</button>`;});
  L.innerHTML=h;
  L.querySelectorAll('.pit').forEach(b=>b.onclick=()=>{
    const p=PAL[+b.dataset.i];closeAll();
    if(p.id)go(p.id);else eval(p.run);
  });
}
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();palOpen();return;}
  if(e.key==='Escape'){popClose();closeAll();toastHide();return;}
  const p=document.getElementById('pal');if(!p.classList.contains('on'))return;
  const items=[...p.querySelectorAll('.pit')];if(!items.length)return;
  let idx=items.findIndex(b=>b.classList.contains('cur'));
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();
    items[Math.max(idx,0)].classList.remove('cur');
    idx=(idx+(e.key==='ArrowDown'?1:items.length-1))%items.length;
    items[idx].classList.add('cur');items[idx].scrollIntoView({block:'nearest'});}
  if(e.key==='Enter'&&idx>-1){e.preventDefault();items[idx].click();}
});
