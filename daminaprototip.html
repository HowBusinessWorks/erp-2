<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Damina ERP — prototip navigabil</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   DESIGN TOKENS  (Partea A5 din planul de implementare)
   ═══════════════════════════════════════════════════════════════ */
:root{
  --bg:#FBFBFA; --surface:#FFFFFF; --surface-2:#F4F4F2; --surface-3:#EDEDEA;
  --border:#E4E4E1; --border-strong:#C9C9C4;
  --text:#1A1A18; --muted:#6B6B66; --faint:#9A9A94;
  --accent:#2563EB; --accent-hover:#1D4ED8; --accent-soft:#EFF4FF;
  --ok:#157F3D; --ok-soft:#E9F6EE;
  --warn:#B45309; --warn-soft:#FDF3E3;
  --danger:#B42318; --danger-soft:#FEF0EF;
  --info:#0E7490; --info-soft:#E7F6F9;
  --delta:#7C3AED; --delta-soft:#F3EEFF;
  --r-sm:6px; --r:10px; --r-lg:14px; --r-full:999px;
  --sh-1:0 1px 2px rgba(20,20,18,.05);
  --sh-2:0 2px 8px rgba(20,20,18,.07);
  --sh-3:0 8px 30px rgba(20,20,18,.12);
  --sh-4:0 20px 60px rgba(20,20,18,.18);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font); background:var(--bg); color:var(--text);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  font-feature-settings:"cv05","ss01";
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#D6D6D2;border-radius:6px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#BEBEB9}
::-webkit-scrollbar-track{background:transparent}

/* ═══════ UTILITARE ═══════ */
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.sm{font-size:13px} .xs{font-size:12px} .lg{font-size:17px}
.b{font-weight:600} .bb{font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.row-t{display:flex;gap:10px}
.col{display:flex;flex-direction:column}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wrap{flex-wrap:wrap}
.grow{flex:1}
.center{text-align:center}
.right{text-align:right}
.mt1{margin-top:4px}.mt2{margin-top:8px}.mt3{margin-top:12px}.mt4{margin-top:16px}
.mt5{margin-top:24px}.mt6{margin-top:32px}
.mb2{margin-bottom:8px}.mb3{margin-bottom:12px}.mb4{margin-bottom:16px}.mb5{margin-bottom:24px}
.hidden{display:none!important}
.ico{width:18px;height:18px;flex:0 0 auto;stroke-width:1.9}
.ico-lg{width:22px;height:22px}
.ico-xl{width:30px;height:30px}

/* ═══════ APP LAYOUT ═══════ */
#app{display:flex;min-height:100vh}

/* ── Sidebar ── */
.side{
  width:236px;flex:0 0 236px;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;height:100vh;position:sticky;top:0;z-index:30;
}
.side-top{padding:16px 14px 10px}
.logo{display:flex;align-items:center;gap:9px;padding:0 6px 12px;font-weight:700;font-size:16px;letter-spacing:-.02em}
.logo-mark{
  width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#2563EB,#7C3AED);
  display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800;flex:0 0 auto;
}
.firm-sel{
  width:100%;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r);
  background:var(--surface-2);border:1px solid var(--border);font-size:13px;font-weight:500;
  transition:.12s;
}
.firm-sel:hover{background:var(--surface-3)}
.nav{flex:1;overflow-y:auto;padding:8px 10px}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;
  font-size:14px;font-weight:500;color:var(--muted);margin-bottom:1px;transition:.11s;
  width:100%;text-align:left;
}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item.on .ico{stroke-width:2.2}
.nav-badge{
  margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:var(--r-full);
  background:var(--danger);color:#fff;font-size:11px;font-weight:700;
  display:grid;place-items:center;
}
.nav-item.on .nav-badge{background:var(--accent)}
.nav-sep{height:1px;background:var(--border);margin:10px 10px}
.side-bot{padding:10px;border-top:1px solid var(--border)}
.user-chip{
  display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r);width:100%;
  transition:.12s;text-align:left;
}
.user-chip:hover{background:var(--surface-2)}
.avatar{
  width:32px;height:32px;border-radius:var(--r-full);background:var(--surface-3);
  display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);flex:0 0 auto;
}
.avatar.acc{background:var(--accent-soft);color:var(--accent)}

/* ── Main ── */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  height:58px;background:rgba(251,251,250,.85);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;
  padding:0 26px;position:sticky;top:0;z-index:25;
}
.crumb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.crumb b{color:var(--text);font-weight:600}
.crumb-sep{color:var(--faint)}
.search{
  display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:var(--r-full);
  background:var(--surface);border:1px solid var(--border);width:280px;font-size:13px;
  color:var(--faint);transition:.12s;
}
.search:hover{border-color:var(--border-strong)}
.icon-btn{
  width:36px;height:36px;border-radius:var(--r);display:grid;place-items:center;
  color:var(--muted);transition:.12s;position:relative;
}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.dot-badge{
  position:absolute;top:5px;right:5px;min-width:16px;height:16px;padding:0 4px;
  border-radius:var(--r-full);background:var(--danger);color:#fff;font-size:10px;
  font-weight:700;display:grid;place-items:center;border:2px solid var(--bg);
}
.page{padding:26px 26px 96px;max-width:1400px;width:100%}
.page-wide{max-width:none}

/* ═══════ TIPOGRAFIE PAGINĂ ═══════ */
.h1{font-size:25px;font-weight:700;letter-spacing:-.025em;line-height:1.2}
.h2{font-size:18px;font-weight:650;letter-spacing:-.015em}
.h3{font-size:15px;font-weight:650}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.lead{font-size:14px;color:var(--muted)}

/* ═══════ CARDURI ═══════ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px}
.card-p0{padding:0;overflow:hidden}
.card-hd{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-bd{padding:18px}
.card.hov{transition:.14s;cursor:pointer}
.card.hov:hover{border-color:var(--border-strong);box-shadow:var(--sh-2);transform:translateY(-1px)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}

/* ═══════ BUTOANE ═══════ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 15px;border-radius:9px;font-size:14px;font-weight:550;
  background:var(--surface);border:1px solid var(--border);transition:.12s;white-space:nowrap;
  box-shadow:var(--sh-1);
}
.btn:hover{background:var(--surface-2);border-color:var(--border-strong)}
.btn:active{transform:translateY(.5px)}
.btn-pri{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 1px 2px rgba(37,99,235,.25)}
.btn-pri:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn-ok:hover{background:#0F6B32;border-color:#0F6B32}
.btn-dan{background:var(--surface);color:var(--danger);border-color:#F3CFCC}
.btn-dan:hover{background:var(--danger-soft)}
.btn-ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn-xs{padding:4px 9px;font-size:12px;border-radius:7px}
.btn-lg{padding:12px 20px;font-size:15px;border-radius:10px}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-grp{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:2px;gap:2px}
.btn-grp button{padding:5px 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--muted);transition:.12s}
.btn-grp button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--sh-1)}

/* ═══════ BADGE / PILL ═══════ */
.pill{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--r-full);
  font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);
  border:1px solid transparent;white-space:nowrap;
}
.pill .dt{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-dan{background:var(--danger-soft);color:var(--danger)}
.p-info{background:var(--info-soft);color:var(--info)}
.p-acc{background:var(--accent-soft);color:var(--accent)}
.p-delta{background:var(--delta-soft);color:var(--delta)}
.p-out{background:transparent;border-color:var(--border);color:var(--muted)}

/* ═══════ TABEL ═══════ */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{
  text-align:left;padding:9px 14px;font-size:11px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--border);
  background:var(--surface);position:sticky;top:0;white-space:nowrap;
}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tbody tr{transition:.1s}
.tbl tbody tr.clk{cursor:pointer}
.tbl tbody tr.clk:hover{background:var(--surface-2)}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl .r{text-align:right}
.tbl .num{font-variant-numeric:tabular-nums}

/* ═══════ BARE DE BUGET (A5.4) ═══════ */
.bar-wrap{margin:9px 0}
.bar{
  height:12px;border-radius:var(--r-full);background:var(--surface-3);overflow:hidden;
  display:flex;position:relative;
}
.bar-fill{height:100%;transition:width .5s cubic-bezier(.4,0,.2,1)}
.bar-eng{
  height:100%;transition:width .5s;opacity:.55;
  background-image:repeating-linear-gradient(45deg,currentColor 0 4px,transparent 4px 8px);
}
.bar-ok .bar-fill{background:var(--ok)} .bar-ok .bar-eng{color:var(--ok)}
.bar-warn .bar-fill{background:var(--warn)} .bar-warn .bar-eng{color:var(--warn)}
.bar-dan .bar-fill{background:var(--danger)} .bar-dan .bar-eng{color:var(--danger)}
/* Delta — logică inversă, se UMPLE */
.bar-delta{background:transparent;border:1.5px dashed #CBB8F0}
.bar-delta .bar-fill{background:var(--delta)}
.bar-delta.d-low .bar-fill{background:var(--danger)}
.bar-delta.d-mid .bar-fill{background:var(--warn)}
.bar-delta.d-hi .bar-fill{background:var(--ok)}
.bar-lbl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px}

/* ═══════ COMPONENTA BUGET ═══════ */
.budget{padding:16px 18px;border-radius:var(--r-lg);border:1px solid var(--border);background:var(--surface);margin-bottom:12px}
.budget.b-delta{background:linear-gradient(180deg,#FBF9FF,#fff);border-color:#E4D9F8}
.budget-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px}
.budget-name{display:flex;align-items:center;gap:8px;font-weight:650;font-size:15px}
.budget-sub{font-size:12.5px;color:var(--muted)}
.budget-pct{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ═══════ ALERTE ═══════ */
.alert{
  display:flex;gap:11px;padding:12px 14px;border-radius:var(--r);font-size:13.5px;
  border:1px solid transparent;align-items:flex-start;
}
.alert .ico{margin-top:1px}
.a-warn{background:var(--warn-soft);color:#7C3D06;border-color:#F5DFBB}
.a-dan{background:var(--danger-soft);color:#8A1B12;border-color:#F5CFCB}
.a-ok{background:var(--ok-soft);color:#0D5E2C;border-color:#C7E8D4}
.a-info{background:var(--info-soft);color:#0A5A6E;border-color:#C6E6EE}
.a-acc{background:var(--accent-soft);color:#1A3E8C;border-color:#D3E1FE}
.a-delta{background:var(--delta-soft);color:#5B21B6;border-color:#DDCEFA}

/* ═══════ LISTE DE LUCRU ═══════ */
.todo{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.todo-hd{padding:13px 17px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px}
.todo-item{
  display:flex;align-items:center;gap:13px;padding:13px 17px;border-bottom:1px solid var(--border);
  transition:.1s;cursor:pointer;
}
.todo-item:last-child{border-bottom:none}
.todo-item:hover{background:var(--surface-2)}
.todo-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto}
.todo-txt{flex:1;min-width:0}
.todo-txt .t{font-weight:550;font-size:14px}
.todo-txt .s{font-size:12.5px;color:var(--muted);margin-top:1px}

/* ═══════ FORMULARE ═══════ */
.field{margin-bottom:15px}
.label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.inp,.sel,.ta{
  width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--border);
  background:var(--surface);font-size:14px;transition:.12s;
}
.inp:focus,.sel:focus,.ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ta{min-height:74px;resize:vertical;font-family:inherit}
.hint{font-size:12px;color:var(--faint);margin-top:4px}
.seg{display:flex;gap:7px;flex-wrap:wrap}
.seg-opt{
  padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface);
  font-size:13.5px;font-weight:500;transition:.12s;
}
.seg-opt:hover{border-color:var(--border-strong)}
.seg-opt.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:650}
.radio-card{
  display:flex;gap:11px;padding:13px;border-radius:var(--r);border:1.5px solid var(--border);
  background:var(--surface);cursor:pointer;transition:.12s;align-items:flex-start;margin-bottom:8px;
}
.radio-card:hover{border-color:var(--border-strong);background:var(--surface-2)}
.radio-card.on{border-color:var(--accent);background:var(--accent-soft)}
.rdot{
  width:18px;height:18px;border-radius:50%;border:2px solid var(--border-strong);flex:0 0 auto;
  margin-top:1px;display:grid;place-items:center;transition:.12s;background:#fff;
}
.radio-card.on .rdot{border-color:var(--accent)}
.radio-card.on .rdot::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent)}
.chk{
  width:19px;height:19px;border-radius:5px;border:2px solid var(--border-strong);flex:0 0 auto;
  display:grid;place-items:center;transition:.12s;background:#fff;cursor:pointer;
}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk.on::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}

/* ═══════ MODAL ═══════ */
.overlay{
  position:fixed;inset:0;background:rgba(20,20,18,.42);backdrop-filter:blur(3px);
  z-index:100;display:grid;place-items:center;padding:20px;
  animation:fadeIn .16s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.modal{
  background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-4);
  width:100%;max-width:540px;max-height:88vh;display:flex;flex-direction:column;
  animation:popIn .2s cubic-bezier(.2,.8,.3,1);
}
.modal-lg{max-width:800px}
.modal-xl{max-width:1050px}
.modal-hd{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.modal-bd{padding:20px 22px;overflow-y:auto;flex:1}
.modal-ft{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;background:var(--surface-2);border-radius:0 0 var(--r-lg) var(--r-lg)}

/* ═══════ TOAST ═══════ */
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none}
.toast{
  display:flex;align-items:center;gap:10px;padding:11px 17px;border-radius:var(--r-full);
  background:#1A1A18;color:#fff;font-size:13.5px;font-weight:500;box-shadow:var(--sh-3);
  animation:toastIn .25s cubic-bezier(.2,.8,.3,1);max-width:min(560px,90vw);
}
@keyframes toastIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.toast.ok{background:#0F5C2E}
.toast.warn{background:#8A4408}
.toast.dan{background:#8A1B12}

/* ═══════ TABS ═══════ */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tab{
  padding:9px 14px;font-size:14px;font-weight:550;color:var(--muted);
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:.12s;white-space:nowrap;
}
.tab:hover{color:var(--text)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:650}

/* ═══════ STARE GOALĂ ═══════ */
.empty{padding:46px 20px;text-align:center;color:var(--muted)}
.empty .ico{width:38px;height:38px;color:var(--faint);margin-bottom:12px;stroke-width:1.4}
.empty .t{font-weight:600;color:var(--text);margin-bottom:5px;font-size:15px}

/* ═══════ TIMELINE ISTORIC ═══════ */
.tl-month{margin-bottom:22px}
.tl-mhd{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:7px;border-bottom:1px solid var(--border);margin-bottom:10px}
.tl-item{display:flex;gap:13px;padding:11px 0}
.tl-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto}

/* ═══════ GANTT ═══════ */
.gantt{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface)}
.gantt table{border-collapse:collapse;width:100%;min-width:780px}
.gantt th{padding:7px 3px;font-size:11px;font-weight:600;color:var(--faint);border-bottom:1px solid var(--border);text-align:center;background:var(--surface-2)}
.gantt th.gname{text-align:left;padding-left:14px;width:190px;position:sticky;left:0;background:var(--surface-2);z-index:2}
.gantt td{border-bottom:1px solid var(--border);padding:0;height:46px;position:relative}
.gantt td.gname{
  padding:6px 12px;font-size:13px;font-weight:550;width:190px;position:sticky;left:0;
  background:var(--surface);z-index:2;border-right:1px solid var(--border);line-height:1.25;
}
.gantt td.gcell{border-right:1px solid #F2F2EF;min-width:38px;cursor:pointer;transition:.1s}
.gantt td.gcell:hover{background:var(--accent-soft)}
.gantt td.we{background:#FAFAF8}
.gbar{
  position:absolute;top:9px;bottom:9px;border-radius:7px;display:flex;align-items:center;
  padding:0 9px;font-size:11.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;
  cursor:pointer;transition:.12s;z-index:1;box-shadow:var(--sh-1);
}
.gbar:hover{filter:brightness(1.08);transform:scale(1.01)}

/* ═══════ PHONE FRAME (shell teren) ═══════ */
.teren-stage{
  min-height:100vh;flex:1;width:100%;display:flex;align-items:center;justify-content:center;gap:38px;
  padding:30px;background:
    radial-gradient(1000px 600px at 20% 0%,#EFF3FB 0%,transparent 60%),
    radial-gradient(800px 500px at 90% 100%,#F5F0FC 0%,transparent 55%),#F2F2EF;
}
.phone{
  width:392px;height:812px;background:#111;border-radius:44px;padding:11px;
  box-shadow:0 40px 90px rgba(20,20,18,.3),0 0 0 1px rgba(0,0,0,.1);flex:0 0 auto;position:relative;
}
.phone-scr{
  width:100%;height:100%;background:var(--bg);border-radius:34px;overflow:hidden;
  display:flex;flex-direction:column;position:relative;
}
.notch{
  position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:26px;
  background:#111;border-radius:0 0 16px 16px;z-index:60;
}
.teren-aside{max-width:330px;flex:0 0 auto}

/* ── conținut mobil ── */
.m-status{
  height:38px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 22px 3px;font-size:12px;font-weight:600;color:var(--text);flex:0 0 auto;
}
.m-top{
  padding:9px 16px;display:flex;align-items:center;gap:11px;background:var(--surface);
  border-bottom:1px solid var(--border);flex:0 0 auto;min-height:52px;
}
.m-top .t{font-weight:650;font-size:16px;line-height:1.2}
.m-top .s{font-size:12px;color:var(--muted)}
.m-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:8px}
.m-body::-webkit-scrollbar{width:0}
.m-pad{padding:14px 16px}
.m-offline{
  background:#3B3B37;color:#fff;font-size:12px;font-weight:550;padding:6px 16px;
  display:flex;align-items:center;gap:7px;flex:0 0 auto;
}
.m-cta{padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--border);flex:0 0 auto}
.m-btn{
  width:100%;height:54px;border-radius:13px;background:var(--accent);color:#fff;
  font-size:16px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:9px;
  box-shadow:0 2px 10px rgba(37,99,235,.28);transition:.12s;
}
.m-btn:active{transform:scale(.985)}
.m-btn.sec{background:var(--surface);color:var(--text);border:1px solid var(--border-strong);box-shadow:none}
.m-btn.ok{background:var(--ok);box-shadow:0 2px 10px rgba(21,127,61,.28)}
.m-btn:disabled{background:var(--surface-3);color:var(--faint);box-shadow:none}
.m-tabs{
  display:flex;background:var(--surface);border-top:1px solid var(--border);
  padding:7px 0 calc(9px + env(safe-area-inset-bottom));flex:0 0 auto;
}
.m-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--faint);padding:2px}
.m-tab.on{color:var(--accent)}
.m-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:15px;margin-bottom:11px}
.m-ctx{
  background:linear-gradient(135deg,#EFF4FF,#F6F0FF);border:1px solid #D9E3FD;
  border-radius:var(--r-lg);padding:15px;margin-bottom:14px;
}
.m-quad{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.m-quad-btn{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:17px 11px;display:flex;flex-direction:column;align-items:center;gap:9px;
  font-size:13.5px;font-weight:650;line-height:1.2;text-align:center;transition:.12s;
  box-shadow:var(--sh-1);min-height:104px;justify-content:center;
}
.m-quad-btn:active{transform:scale(.97);background:var(--surface-2)}
.m-quad-btn .qi{width:44px;height:44px;border-radius:13px;display:grid;place-items:center}
.m-list-item{
  display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--surface);
  border-bottom:1px solid var(--border);transition:.1s;text-align:left;width:100%;
}
.m-list-item:active{background:var(--surface-2)}
.m-prog{height:7px;border-radius:var(--r-full);background:var(--surface-3);overflow:hidden}
.m-prog i{display:block;height:100%;background:var(--accent);border-radius:var(--r-full);transition:width .35s}
.big-choice{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  padding:22px 12px;border-radius:15px;border:2px solid var(--border);background:var(--surface);
  font-size:16px;font-weight:700;transition:.12s;flex:1;min-height:118px;
}
.big-choice:active{transform:scale(.97)}
.bc-ok{border-color:#BEE3CD;background:var(--ok-soft);color:var(--ok)}
.bc-ok.sel{border-color:var(--ok);box-shadow:0 0 0 3px rgba(21,127,61,.16)}
.bc-no{border-color:#F2CFCB;background:var(--danger-soft);color:var(--danger)}
.bc-no.sel{border-color:var(--danger);box-shadow:0 0 0 3px rgba(180,35,24,.16)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{
  width:44px;height:44px;border-radius:11px;border:1px solid var(--border);background:var(--surface);
  font-size:21px;font-weight:600;display:grid;place-items:center;color:var(--muted);
}
.stepper button:active{background:var(--surface-2)}
.stepper .val{flex:1;text-align:center;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.sheet-wrap{position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(20,20,18,.4);animation:fadeIn .16s}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;max-height:88%;display:flex;flex-direction:column;animation:sheetUp .24s cubic-bezier(.2,.8,.3,1)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sheet-hd{padding:16px 18px 12px;border-bottom:1px solid var(--border)}
.sheet-bd{padding:16px 18px;overflow-y:auto}
.sheet-ft{padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}
.grabber{width:38px;height:4px;border-radius:2px;background:var(--border-strong);margin:0 auto 12px}

/* ═══════ PORTAL SHELL ═══════ */
.portal-top{
  background:var(--surface);border-bottom:1px solid var(--border);padding:0 26px;height:60px;
  display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:25;
}
.portal-body{max-width:1080px;margin:0 auto;padding:26px 22px 60px}

/* ═══════ DEMO SWITCHER ═══════ */
#demo{
  position:fixed;right:18px;bottom:18px;z-index:150;display:flex;flex-direction:column;
  align-items:flex-end;gap:9px;
}
.demo-panel{
  background:#1C1C1A;color:#EDEDEA;border-radius:15px;padding:14px;width:302px;
  box-shadow:var(--sh-4);border:1px solid #35352F;animation:popIn .18s;
}
.demo-panel .dh{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#8B8B84;margin-bottom:9px}
.demo-role{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;width:100%;
  text-align:left;font-size:13px;transition:.11s;color:#DDDDD8;margin-bottom:2px;
}
.demo-role:hover{background:#2A2A26}
.demo-role.on{background:#2563EB;color:#fff;font-weight:600}
.demo-role .ra{width:26px;height:26px;border-radius:7px;background:#33332E;display:grid;place-items:center;font-size:10px;font-weight:700;flex:0 0 auto}
.demo-role.on .ra{background:rgba(255,255,255,.22)}
.demo-role .rs{font-size:11px;opacity:.65;display:block;font-weight:400}
.demo-fab{
  width:50px;height:50px;border-radius:50%;background:#1C1C1A;color:#fff;
  display:grid;place-items:center;box-shadow:var(--sh-3);border:1px solid #35352F;transition:.14s;
}
.demo-fab:hover{transform:scale(1.06)}
.demo-sep{height:1px;background:#35352F;margin:9px 0}
.demo-link{
  display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;width:100%;
  text-align:left;font-size:12.5px;color:#AFAFA8;transition:.11s;
}
.demo-link:hover{background:#2A2A26;color:#fff}

/* ═══════ ONBOARDING / TUR ═══════ */
.tour-card{
  background:var(--surface);border-radius:20px;padding:34px 28px;text-align:center;
  max-width:400px;box-shadow:var(--sh-4);animation:popIn .22s;
}
.tour-emoji{font-size:46px;margin-bottom:16px;display:block}
.tour-dots{display:flex;gap:7px;justify-content:center;margin:20px 0 4px}
.tour-dots i{width:7px;height:7px;border-radius:50%;background:var(--border-strong)}
.tour-dots i.on{background:var(--accent);width:20px;border-radius:4px}

/* ═══════ MISC ═══════ */
.kv{display:flex;justify-content:space-between;gap:14px;padding:7px 0;font-size:13.5px;border-bottom:1px solid var(--border)}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted)}
.kv .v{font-weight:600;font-variant-numeric:tabular-nums}
.photo{
  aspect-ratio:4/3;border-radius:9px;background:linear-gradient(135deg,#E8E8E4,#D8D8D3);
  display:flex;align-items:flex-end;padding:7px;font-size:10px;color:#fff;
  position:relative;overflow:hidden;
}
.photo::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.55))}
.photo span{position:relative;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.5);line-height:1.25}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:9px}
.sig-pad{
  height:118px;border:2px dashed var(--border-strong);border-radius:11px;background:var(--surface-2);
  display:grid;place-items:center;color:var(--faint);font-size:13px;cursor:crosshair;position:relative;
}
.sig-pad.signed{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.timer{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;
  padding:3px 9px;border-radius:var(--r-full);font-variant-numeric:tabular-nums;
}
.pdf-page{
  background:#fff;border:1px solid var(--border-strong);border-radius:5px;padding:22px;
  font-size:11.5px;line-height:1.6;box-shadow:var(--sh-2);
}
.hl-field{background:#FFF6D6;border-bottom:1.5px solid #E5B700;padding:1px 4px;border-radius:3px}
.note{
  font-size:12.5px;color:var(--muted);padding:9px 12px;background:var(--surface-2);
  border-radius:9px;border-left:3px solid var(--border-strong);
}
.spec{
  font-size:11.5px;color:#7A6BAE;background:#F6F2FE;border:1px dashed #D8CBF5;
  border-radius:7px;padding:5px 9px;display:inline-flex;align-items:center;gap:6px;font-weight:600;
}
.scroll-x{overflow-x:auto}
.divider{height:1px;background:var(--border);margin:18px 0}

@media(max-width:900px){
  .side{display:none}
  .page{padding:16px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .teren-stage{padding:0;background:var(--bg)}
  .phone{width:100%;height:100vh;border-radius:0;padding:0;box-shadow:none}
  .phone-scr{border-radius:0}
  .notch{display:none}
  .teren-aside{display:none}
}
</style>

const LUNI=['ian','feb','mar','apr','mai','iun','iul','aug','sep','oct','nov','dec'];
const LUNI_L=['ianuarie','februarie','martie','aprilie','mai','iunie','iulie','august','septembrie','octombrie','noiembrie','decembrie'];
function lei(v,dec){
  if(v==null)return '—';
  const neg=v<0; v=Math.abs(v);
  let s;
  if(dec||v<1000&&v%1!==0){s=v.toFixed(2).replace('.',',');const p=s.split(',');s=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.')+','+p[1];}
  else{s=Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
  return (neg?'−':'')+s;
}
function leiu(v,dec){return lei(v,dec)+' lei';}
function qty(v,um){
  let s=(Math.round(v*10000)/10000).toString().replace('.',',');
  return s+(um?' '+um:'');
}
function dstr(iso){const d=new Date(iso);return d.getDate()+' '+LUNI[d.getMonth()]+' '+d.getFullYear();}
function dshort(iso){const d=new Date(iso);return d.getDate()+' '+LUNI[d.getMonth()];}
function dnum(iso){const d=new Date(iso);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0');}
function pct(v){return Math.round(v)+'%';}
function ini(n){return n.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function plural(n,a,b,c){const m=n%100;if(n===1)return a;if(n===0||(m>=1&&m<=19))return c||b;return b;}

/* Bara de consum — NU depăși (A5.4) */
function BugetConsum(o){
  const total=o.consumat+(o.angajat||0);
  const p=o.plafon>0?Math.min(100,total/o.plafon*100):0;
  const pc=o.plafon>0?o.consumat/o.plafon*100:0;
  const pa=o.plafon>0?Math.min(100-pc,(o.angajat||0)/o.plafon*100):0;
  const real=o.plafon>0?total/o.plafon*100:0;
  const cls=real>100?'bar-dan':real>=90?'bar-dan':real>=70?'bar-warn':'bar-ok';
  const rest=o.plafon-total;
  return '<div class="bar-wrap"><div class="bar '+cls+'">'+
    '<div class="bar-fill" style="width:'+Math.min(100,pc)+'%"></div>'+
    (pa>0?'<div class="bar-eng" style="width:'+pa+'%"></div>':'')+
  '</div><div class="bar-lbl"><span>consumat <b class="num">'+lei(o.consumat)+'</b>'+
    (o.angajat?' · comandat <b class="num">'+lei(o.angajat)+'</b>':'')+'</span>'+
    '<span>'+(rest>=0?'îți mai rămân <b class="num">'+lei(rest)+'</b>':'<b style="color:var(--danger)">depășit cu '+lei(-rest)+'</b>')+'</span>'+
  '</div></div>';
}

/* Bara Delta — se UMPLE (logică inversă) */
function DeltaUmplere(o){
  const p=o.plafon>0?Math.min(100,o.umplut/o.plafon*100):0;
  const cls=p<50?'d-low':p<85?'d-mid':'d-hi';
  return '<div class="bar-wrap"><div class="bar bar-delta '+cls+'">'+
    '<div class="bar-fill" style="width:'+p+'%"></div></div>'+
  '<div class="bar-lbl"><span>umplut <b class="num">'+lei(o.umplut)+'</b></span>'+
  '<span>liber <b class="num" style="color:var(--danger)">'+lei(o.plafon-o.umplut)+'</b></span></div></div>';
}

function render(){
  const app=document.getElementById('app');
  const p=ROUTE.parts;
  const R=curRol();
  let out='';

  if(p[0]==='teren'){ out=renderTeren(p); }
  else if(p[0]==='portal'){ out=shellPortal(renderPortal(p)); }
  else if(p[0]==='semneaza'){ out=renderSemnare(); }
  else { out=renderBirou(p); }

  app.innerHTML=out;
  renderDemo();
  renderModal();
  if(S.tour>0)renderTour();
}

function renderBirou(p){
  const k=p[0]||'acasa';
  if(k==='acasa')      return shellBirou(scrAcasa(),crumb('Acasă'));
  if(k==='contracte')  return p[1]?shellBirou(scrContract(p[1],p[2]||'luna'),crumb('<a href="#/contracte">Contracte</a>',p[1]))
                                  :shellBirou(scrContracte(),crumb('Contracte'));
  if(k==='obiective')  return p[1]?shellBirou(scrObiectiv(p[1]),crumb('<a href="#/obiective">Obiective</a>',obi(p[1]).nume))
                                  :shellBirou(scrObiective(),crumb('Obiective'));
  if(k==='lucrari')    return p[1]?shellBirou(scrLucrare(p[1],p[2]||'rezumat'),crumb('<a href="#/lucrari">Lucrări</a>',p[1]))
                                  :shellBirou(scrLucrari(),crumb('Lucrări'));
  if(k==='cereri'){
    if(p[1]==='backlog')return shellBirou(scrBacklog(),crumb('<a href="#/cereri">Cereri</a>','Backlog de propuneri'));
    if(p[1])            return shellBirou(scrCerere(p[1]),crumb('<a href="#/cereri">Cereri</a>',p[1]));
    return shellBirou(scrCereri(),crumb('Cereri'));
  }
  if(k==='devize')     return shellBirou(scrDevize(),crumb('Devize'));
  if(k==='situatii')   return p[1]?shellBirou(scrSituatie(p[1]),crumb('<a href="#/situatii">Situații</a>',p[1]))
                                  :shellBirou(scrSituatii(),crumb('Situații de lucrări'));
  if(k==='achizitii')  return shellBirou(scrAchizitii(p[1]),crumb('Achiziții'));
  if(k==='stoc')       return shellBirou(scrStoc(p[1]),crumb('Stoc și magazie'));
  if(k==='flota')      return shellBirou(scrFlota(p),crumb('Flotă'));
  if(k==='transport')  return shellBirou(scrTransport(),crumb('Transport'));
  if(k==='documente')  return shellBirou(scrDocumente(),crumb('Documente'));
  if(k==='facturare')  return shellBirou(scrFacturare(p[1]),crumb('Facturare'));
  if(k==='perioada')   return shellBirou(scrPerioada(),crumb('Închiderea lunii'));
  if(k==='rapoarte')   return shellBirou(scrRapoarte(p[1]),crumb('Rapoarte'));
  if(k==='setari')     return shellBirou(scrSetari(),crumb('Setări'));
  return shellBirou('<div class="page">'+Empty({t:'Ecranul nu există în prototip',s:'Folosește meniul din stânga.',ico:'search'})+'</div>',crumb('—'));
}

              ['obiective','Obiective'],['realocari','Re-alocări']];
  let body='';
  if(tab==='an')body=tabContractAn(c);
  else if(tab==='proiectie')body=tabContractProiectie(c);
  else if(tab==='obiective')body=tabContractObiective(c);
  else if(tab==='realocari')body=scrRealocariBody();
  else body=tabContractLuna(c);

      '<div class="row mb1"><span class="pill p-out">'+byId(DB.firme,c.firma).nume+'</span>'+

        (liber>0?'<div class="alert a-dan mt3">'+I('alert')+'<div><b>'+leiu(liber)+'</b> pe care îi pierzi dacă nu-i folosești până pe 31 august.'+

function scrLucrare(id,tab){

function scrCerere(id){
  const c=byId(DB.cereri,id);
  if(!c)return '<div class="page">'+Empty({t:'Cerere inexistentă',s:'—'})+'</div>';
  const contract=ctr(c.contract);
  const prag=contract.prag||2000;
  const liber=deltaLiber(c.contract);
  const lucr=contract.comp?contract.comp.find(k=>k.tip==='lucrari'):null;
  const restLucr=lucr?lucr.plafon-lucr.consumat-lucr.angajat:0;

  /* Decizia sistemului */
  let dec,expl,optiuni=[];
  if(c.estimat<prag){
    dec='interventie';
    expl='<b>'+leiu(c.estimat)+'</b> e sub pragul de mentenanță ('+leiu(prag)+'). Se face ca <b>intervenție</b>, plătită din bugetul de Mentenanță.';
    optiuni=[{id:'interventie',t:'Intervenție pe Mentenanță',s:'Sub prag — asta e regula voastră',rec:true},
             {id:'delta',t:'Lucrare mică pe Delta',s:'Dacă vrei să o facturezi separat'},
             {id:'respins',t:'Resping sau amân',s:'Intră în backlog, re-evaluabilă'}];
  } else if(c.estimat<=liber){
    dec='delta';
    expl='<b>'+leiu(c.estimat)+'</b> depășește pragul de mentenanță ('+leiu(prag)+') și <b>încape în Delta liberă</b> a lunii august ('+leiu(liber)+' liberi).';
    optiuni=[{id:'delta',t:'Lucrare mică pe Delta august',s:'După ea îți mai rămân '+leiu(liber-c.estimat)+' de umplut',rec:true},
             {id:'lucrari',t:'Lucrare pe componenta Lucrări',s:'Ai '+leiu(restLucr)+' rest pe august'},
             {id:'respins',t:'Resping sau amân',s:'Intră în backlog'}];
  } else {
    dec='alegere';
    expl='<b>'+leiu(c.estimat)+'</b> depășește Delta liberă a lunii ('+leiu(liber)+'). Trebuie să alegi cum o finanțezi — sistemul nu decide singur aici.';
    optiuni=[{id:'delta_multi',t:'Împart pe mai multe luni de Delta',s:'august '+leiu(liber)+' · septembrie '+leiu(c.estimat-liber),rec:c.estimat<20000},
             {id:'lucrari',t:'Lucrare pe componenta Lucrări',s:'Ai '+leiu(restLucr)+' rest pe august'+(restLucr<c.estimat?' — nu ajunge':''),rec:false},
             {id:'contract',t:'Oportunitate de contract nou',s:'Fac ofertă separată către client',rec:c.estimat>=20000},
             {id:'respins',t:'Resping sau amân',s:'Intră în backlog, candidat pentru umplerea Delta'}];
  }
  const ales=S.cerereDecizie[c.id]||optiuni.find(o=>o.rec).id;

  return '<div class="page" style="max-width:940px">'+
    '<div class="row mb4"><a class="btn btn-sm" href="#/cereri">'+I('arrowL')+'Cereri</a>'+
      '<span class="pill p-out num">'+c.id+'</span>'+Tag(c.tip)+'</div>'+

    '<div class="card mb4">'+
      '<div class="between mb3"><div class="row">'+I(c.sursa==='email'?'mail':c.sursa==='inspectie'?'searchcheck':'phone')+
        '<div><div class="b">'+c.de+'</div><div class="xs muted">'+dstr(c.data)+', 09:14</div></div></div>'+
        (c.sursa==='email'?'<button class="btn btn-sm">Văd emailul întreg</button>':'')+'</div>'+
      '<div class="h2 mb2">'+c.subiect+'</div>'+
      '<p class="lead" style="font-style:italic;padding-left:14px;border-left:3px solid var(--border)">„'+c.text+'"</p>'+
      (c.poze?'<div class="photo-grid mt3" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr))">'+
        Array.from({length:c.poze}).map((_,i)=>'<div class="photo"><span>atașament '+(i+1)+'</span></div>').join('')+'</div>':'')+
    '</div>'+

    '<div class="card mb4"><div class="h3 mb4">Completează</div>'+
      '<div class="grid g2">'+
        '<div class="field"><label class="label">Obiectiv</label>'+
          '<div class="row" style="padding:9px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2)">'+
          I('building')+'<b class="sm">'+obi(c.obiectiv).nume+'</b>'+
          '<span class="pill p-acc" style="margin-left:auto">'+I('sparkles')+'sugerat din text</span></div></div>'+
        '<div class="field"><label class="label">Contract</label>'+
          '<div class="row" style="padding:9px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2)">'+
          I('file')+'<b class="sm">'+c.contract+' · '+part(contract.client).nume+'</b>'+
          '<span class="pill p-out" style="margin-left:auto">derivat automat</span></div>'+
          '<div class="hint">Obiectivul e pe un singur contract activ la '+dshort(c.data)+' — deci nu ai ce alege.</div></div>'+
      '</div>'+
      '<div class="field"><label class="label">Ce e de făcut</label>'+
        '<select class="sel"><option>'+c.operatiune+'</option><option>Altă operațiune…</option></select>'+
        '<div class="hint">Din catalogul de operațiuni standard — de aici vine estimarea.</div></div>'+
      '<div class="card" style="background:var(--surface-2);border:none">'+
        '<div class="between"><div><div class="eyebrow">Cât costă, estimat</div>'+
          '<div class="num" style="font-size:26px;font-weight:700">'+leiu(c.estimat)+'</div>'+

      '<div class="alert '+(dec==='alegere'?'a-warn':'a-acc')+' mb4">'+I(dec==='alegere'?'alert':'info')+'<div>'+expl+'</div></div>'+
      optiuni.map(o=>'<button class="radio-card '+(ales===o.id?'on':'')+'" data-act="cer-opt" data-c="'+c.id+'" data-o="'+o.id+'">'+
        '<div class="rdot"></div><div class="grow"><div class="b">'+o.t+
        (o.rec?' <span class="pill p-acc" style="font-size:10px">recomandat</span>':'')+'</div>'+
        '<div class="sm muted mt1">'+o.s+'</div></div></button>').join('')+
      '<div class="field mt4"><label class="label">De ce? (rămâne în istoric, cu numele tău)</label>'+
        '<textarea class="ta" id="cer-motiv" placeholder="ex. Delta e la 67%, o folosesc.">'+

        '<button class="btn btn-pri btn-lg" data-act="cer-decid" data-c="'+c.id+'" data-o="'+ales+'">'+I('check')+'Decid și deschid</button></div>'+
    '</div>'+
    '<div class="note mt4">'+I('info')+' Asta e cea mai importantă decizie economică din firmă. Azi se ia din cap și nu lasă urmă nicăieri. Aici se salvează cu autor, dată și motiv — și apare în raportul de re-alocări dacă se răzgândește cineva.</div>'+
  '</div>';
}

function scrBacklog(){
  const d=deltaComp('C-4700'), liber=d.plafonVenit-d.umplut, dz=zileRamase();
  const p=d.umplut/d.plafonVenit*100;
  const sel=S.deltaSelectie;
  const selVal=DB.backlog.filter(b=>sel.includes(b.id)).reduce((s,b)=>s+b.val,0);
  return '<div class="page">'+
    '<div class="between mb4"><div><div class="h1">Backlog de propuneri</div>'+
      '<div class="lead mt1">Combustibilul pentru umplerea Delta. Vine automat din punctele „nu e OK" ale inspecțiilor.</div></div>'+
      '<div class="row"><select class="sel" style="width:auto"><option>C-4700 Apa Nova</option><option>C-4712 Primăria S4</option></select>'+
      '<div class="btn-grp"><button class="on">august</button><button>septembrie</button></div></div></div>'+

    '<div class="card mb4" style="background:linear-gradient(180deg,#FBF9FF,#fff);border-color:#E4D9F8">'+
      '<div class="between mb2"><div class="row">'+I('zap','ico-lg')+'<div><div class="h3">Delta august</div>'+
        '<div class="sm muted">poți factura până la '+leiu(d.plafonVenit)+' · nu se reportează</div></div></div>'+
        '<div class="row"><span class="timer p-dan">'+I('clock')+dz+' zile rămase</span>'+
        '<div class="budget-pct" style="color:'+(p<50?'var(--danger)':p<85?'var(--warn)':'var(--ok)')+'">'+pct(p)+'</div></div></div>'+
      DeltaUmplere({umplut:d.umplut,plafon:d.plafonVenit})+
    '</div>'+

    '<div class="card mb4" style="border-color:var(--delta);border-width:1.5px">'+
      '<div class="row mb3">'+I('sparkles','ico-lg')+'<div class="h3">Combinația care umple cel mai bine</div>'+
        '<span class="pill p-delta" style="margin-left:auto">'+leiu(selVal)+' din '+leiu(liber)+'</span></div>'+
      DB.backlog.filter(b=>b.val<=liber&&!b.amanat).map(b=>{
        const on=sel.includes(b.id);
        return '<button class="row" data-act="bl-sel" data-b="'+b.id+'" style="width:100%;padding:10px;border-radius:9px;border:1px solid '+(on?'var(--delta)':'var(--border)')+';background:'+(on?'var(--delta-soft)':'var(--surface)')+';margin-bottom:7px;text-align:left">'+
          '<div class="chk '+(on?'on':'')+'" style="'+(on?'background:var(--delta);border-color:var(--delta)':'')+'"></div>'+
          '<div class="grow"><div class="b sm">'+b.nume+'</div><div class="xs muted">'+obi(b.obiectiv).nume+' · '+b.sursa+'</div></div>'+
          '<div class="num b">'+leiu(b.val)+'</div></button>';
      }).join('')+
      '<div class="between mt3"><div class="sm muted">Rămân neumpluți: <b class="num" style="color:'+(liber-selVal>0?'var(--danger)':'var(--ok)')+'">'+leiu(liber-selVal)+'</b></div>'+
      '<button class="btn btn-pri" data-act="bl-aplica">'+I('zap')+'Le pun pe Delta august ('+sel.length+' '+plural(sel.length,'lucrare','lucrări')+')</button></div>'+
    '</div>'+

    '<div class="card card-p0"><div class="card-hd"><div class="h3">Toate propunerile ('+DB.backlog.length+')</div>'+
      '<div class="row sm muted">'+I('sort')+'Sortate după: încap în Delta liberă</div></div>'+
      '<table class="tbl"><thead><tr><th style="width:110px">Încape?</th><th>Propunere</th><th>Obiectiv</th>'+
      '<th>De unde vine</th><th class="r">Valoare</th><th></th></tr></thead><tbody>'+
      DB.backlog.slice().sort((a,b)=>{
        const ai=a.val<=liber&&!a.amanat?0:a.amanat?2:1, bi=b.val<=liber&&!b.amanat?0:b.amanat?2:1;
        return ai-bi||a.val-b.val;
      }).map(b=>{
        const incape=b.val<=liber&&!b.amanat;
        return '<tr>'+
        '<td>'+(b.amanat?'<span class="pill p-out">'+I('clock')+'amânat</span>':
                incape?'<span class="pill p-ok">'+I('check')+'încape</span>':
                '<span class="pill p-warn">prea mare</span>')+'</td>'+
        '<td><div class="b">'+b.nume+'</div>'+
          (!incape&&!b.amanat?'<div class="xs muted mt1">→ o pot împărți pe 3 luni de Delta, sau o mut pe Lucrări</div>':'')+
          (b.amanat?'<div class="xs muted mt1">→ candidat pentru contract individual separat</div>':'')+'</td>'+
        '<td class="sm">'+obi(b.obiectiv).nume+'</td>'+
        '<td class="sm muted">'+b.sursa+'</td>'+
        '<td class="r num b">'+leiu(b.val)+'</td>'+
        '<td>'+(incape?'<button class="btn btn-xs btn-pri" data-act="bl-pun" data-b="'+b.id+'">Pun pe Delta</button>':
                b.amanat?'<button class="btn btn-xs">Fac ofertă</button>':
                '<button class="btn btn-xs" data-act="bl-imparte" data-b="'+b.id+'">Văd cum o împart</button>')+'</td></tr>';
      }).join('')+'</tbody></table></div>'+
    '<div class="note mt4">'+I('info')+' Sortarea implicită nu e după dată sau valoare, ci după <b>„încap în Delta liberă"</b>. Ecranul are un singur scop: să umple luna înainte de 31.</div>'+
  '</div>';
}

function renderTeren(p){
  const s=p[1];
  if(s==='inspectie') return shellTeren(terInspectie(p[2]));
  if(s==='material')  return shellTeren(terMaterial());
  if(s==='pontaj')    return shellTeren(terPontaj());
  if(s==='utilaje'){
    if(p[2]==='cer')  return shellTeren(terCerUtilaj());
    if(p[2]==='pv')   return shellTeren(terPV(p[3]));
    if(p[2])          return shellTeren(terUtilaj(p[2]));
    return shellTeren(terUtilaje());
  }
  if(s==='situatii')  return shellTeren(p[2]?terSituatie(p[2]):terSituatii());
  if(s==='lucrari')   return shellTeren(p[2]?terLucrare(p[2]):terLucrari());
  if(s==='coada')     return shellTeren(terCoada());
  if(s==='profil')    return shellTeren(terProfil());
  if(s==='interventie')return shellTeren(terInterventie());
  return shellTeren(terAcasa());
}

Object.assign(ACT,{
/* — Cereri / routing — */
'cer-opt':t=>{S.cerereDecizie[t.dataset.c]=t.dataset.o;render();},
'cer-decid':t=>{
  const c=byId(DB.cereri,t.dataset.c), o=t.dataset.o;
  const motiv=(document.getElementById('cer-motiv')||{}).value||'';
  if(o==='respins'){
    c.status='in_backlog';
    DB.backlog.unshift({id:'BL-'+(DB.backlog.length+1),nume:c.subiect,val:c.estimat,
      obiectiv:c.obiectiv,contract:c.contract,sursa:'Din cererea '+c.id,data:c.data});
    toast('Cererea a intrat în backlog. O poți refolosi când cauți cu ce umpli Delta.','ok');
  } else {
    c.status='acceptata';c.decizie=o;c.decizie_motiv=motiv;
    const d=deltaComp(c.contract);
    if(o==='delta'&&d){d.umplut+=c.estimat;}
    if(o==='delta_multi'&&d){const liber=d.plafonVenit-d.umplut;d.umplut+=liber;}
    if(o==='interventie'){const k=ctr(c.contract).comp.find(x=>x.tip==='mentenanta');if(k)k.angajat+=c.estimat;}
    if(o==='lucrari'){const k=ctr(c.contract).comp.find(x=>x.tip==='lucrari');if(k)k.angajat+=c.estimat;}

/* — Backlog / Delta — */
'bl-sel':t=>{
  const id=t.dataset.b, i=S.deltaSelectie.indexOf(id);
  if(i>=0)S.deltaSelectie.splice(i,1);else S.deltaSelectie.push(id);
  render();
},
'bl-aplica':()=>{
  const d=deltaComp('C-4700');
  const sel=DB.backlog.filter(b=>S.deltaSelectie.includes(b.id));
  const val=sel.reduce((s,b)=>s+b.val,0);
  if(!val){toast('Alege întâi ce pui pe Delta','warn');return;}
  d.umplut=Math.min(d.plafonVenit,d.umplut+val);
  sel.forEach(b=>{const i=DB.backlog.indexOf(b);if(i>=0)DB.backlog.splice(i,1);});
  S.deltaSelectie=[];
  toast(sel.length+' '+plural(sel.length,'lucrare pusă','lucrări puse')+' pe Delta august · '+leiu(val)+' facturabili în plus','ok','zap');
  render();
},
'bl-pun':t=>{
  const b=byId(DB.backlog,t.dataset.b), d=deltaComp('C-4700');
  d.umplut=Math.min(d.plafonVenit,d.umplut+b.val);
  DB.backlog.splice(DB.backlog.indexOf(b),1);
  S.deltaSelectie=S.deltaSelectie.filter(x=>x!==b.id);
  toast('„'+b.nume+'" a intrat pe Delta august · +'+leiu(b.val),'ok','zap');
  render();
},
'bl-imparte':t=>{
  const b=byId(DB.backlog,t.dataset.b), liber=deltaLiber('C-4700');
  const luni=Math.ceil(b.val/12500);
  openModal({titlu:'Împart pe mai multe luni de Delta',sub:b.nume+' · '+leiu(b.val),
    body:'<div class="alert a-info mb4">'+I('info')+'<div>O lucrare poate fi finanțată din mai multe luni de Delta simultan. Fiecare lună primește o alocare separată — nu e o rescriere, e o legătură în plus.</div></div>'+
    Array.from({length:luni}).map((_,i)=>{
      const v=i===0?Math.min(liber,b.val):Math.min(12500,b.val-liber-(i-1)*12500);
      return '<div class="row" style="padding:11px;border:1px solid var(--border);border-radius:9px;margin-bottom:8px">'+
      '<div class="chk on"></div><div class="grow"><b class="sm">'+LUNI_L[7+i]+' 2026</b>'+
      '<div class="xs muted">'+(i===0?'ce mai e liber acum':'plafon lunar întreg')+'</div></div>'+
      '<b class="num">'+leiu(Math.max(0,v))+'</b></div>';
    }).join(''),
    footer:'<button class="btn" data-act="modal-close">Renunț</button>'+
      '<button class="btn btn-pri" data-act="bl-imparte-ok" data-b="'+b.id+'">Creez '+luni+' alocări</button>'});
},
'bl-imparte-ok':t=>{
  const b=byId(DB.backlog,t.dataset.b), d=deltaComp('C-4700');
  d.umplut=d.plafonVenit;
  DB.backlog.splice(DB.backlog.indexOf(b),1);

},

'insp-poza':()=>{const p=DB.checklist.puncte[S.inspectie.idx];

  r.poza=(r.poza||0)+1;S.inspectie.rasp[p.n]=r;render();

'insp-out':t=>{const p=DB.checklist.puncte[S.inspectie.idx];

'insp-next':()=>{
  const n=DB.checklist.puncte.length;
  if(S.inspectie.idx>=n-1){
    S.inspectie.done=true;
    const nok=Object.values(S.inspectie.rasp).filter(r=>r.v==='nok');
    nok.filter(r=>r.out==='propunere').forEach(r=>{
      DB.backlog.unshift({id:'BL-'+(90+DB.backlog.length),nume:r.t,val:r.est,
        obiectiv:'OB-0142',contract:'C-4700',sursa:'Inspecție electrică · punct NOK',data:AZI});
    });
    nok.filter(r=>r.out==='interventie').forEach(r=>{
      DB.cereri.unshift({id:'CER-'+(419+DB.cereri.length),tip:'constatare',sursa:'inspectie',status:'neprocesata',
        data:AZI,de:'Inspecție electrică · Marian Radu',obiectiv:'OB-0142',contract:'C-4700',
        subiect:r.t,text:'Găsit la inspecția din 20 august. '+(r.desc||''),poze:r.poza||1,
        estimat:r.est,operatiune:r.t,prioritate:'normala'});
    });
    render();
  } else {S.inspectie.idx++;render();}
},

'insp-reset':()=>{S.inspectie={idx:0,rasp:{},done:false,started:false};nav('#/teren');

  const html=dif>0?I('check')+'<div class="sm"><b>'+dif+' ore lucrate</b> · calculat automat, nu îl tastezi</div>':
    dif<0?I('alert')+'<div class="sm">Contorul nu poate fi mai mic decât la predare ('+lei(pv.orePred)+')</div>':'';
  if(box){box.className='alert mt2 '+(dif>0?'a-ok':'a-dan');box.innerHTML=html;}
  else if(html){const d=document.createElement('div');d.className='alert mt2 '+(dif>0?'a-ok':'a-dan');
    d.innerHTML=html;t.parentNode.appendChild(d);}
  const btn=document.querySelector('[data-act="pv-inchid"]');
  if(btn)btn.disabled=!(dif>0&&S.pvUtilaj.semnat);
},
'pk-pret':t=>{
  const v=parseFloat(String(t.value).replace(',','.'));
  if(!isNaN(v)){S.portalPreturi[t.dataset.l]=v;
    clearTimeout(window._pkT);window._pkT=setTimeout(render,600);}
},
'mat-cauta':t=>{
  const q=t.value.toLowerCase();
  if(q.length<2)return;
}
});

Object.assign(CHG,{
'pv-ret':t=>{S.pvUtilaj.returnator=t.value;}
});

/* ═══════════════════════════════════════════════════════════════
   PORNIRE
   ═══════════════════════════════════════════════════════════════ */
parseRoute();
render();
